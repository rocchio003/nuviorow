name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Versione build
        id: v
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Rinomina APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "NuvioRows-${{ steps.v.outputs.version }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk NuvioRows.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NuvioRows-${{ steps.v.outputs.version }}
          path: NuvioRows-${{ steps.v.outputs.version }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: NuvioRows v${{ steps.v.outputs.version }}
          files: |
            NuvioRows-${{ steps.v.outputs.version }}.apk
            NuvioRows.apk
